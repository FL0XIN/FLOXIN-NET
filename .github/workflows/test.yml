name: test
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install dnslib
      - run: bash tests/test_commands.sh
      - run: bash tests/test_dns.sh
      - run: bash tests/test_install.sh
